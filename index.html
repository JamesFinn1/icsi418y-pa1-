<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Managment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    </header>
    <main>
        <form id="task-form">
            <fieldset>
                <legend>Create a Task</legend>

                <label> Task Name: </label>
                <input type="text" id="task-input" placeholder="Enter Task"><br><br>
                <label>Priority:</label>
                <div>
                    <input type="radio" id="priority-low" name="priority" value="Low">
                    <label for="priority-low">Low</label>
                </div>
                <div>
                    <input type="radio" id="priority-medium" name="priority" value="Medium">
                    <label for="priority-medium">Medium</label>
                </div>
                <div>
                    <input type="radio" id="priority-high" name="priority" value="High">
                    <label for="priority-high">High</label>
                </div>
                <br>
                <button type="submit">Add Task</button>
            </fieldset>

            <h2>Task Area:</h2>
            <div id="task-list"> 
            </div>

        </form>
    </main>

    <footer>
    </footer>

    <script src="script.js"></script>
</body>
</html>
